name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: '--bundles appimage,deb'
          - platform: macos-latest
            args: '--bundles dmg,app'
          - platform: windows-latest
            args: '--bundles nsis'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: |
          bun install
          cd app && bun install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Ditto v__VERSION__'
          releaseBody: 'Precompiled builds of Ditto.'
          releaseDraft: false
          prerelease: false
          uploadPlainBinary: true
          args: ${{ matrix.args }}

      - name: Upload standalone binary
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            [ -f "target/release/ditto" ] && gh release upload ${{ github.ref_name }} target/release/ditto#ditto-linux-x86_64 --clobber || true
            [ -f "src-tauri/target/release/ditto" ] && gh release upload ${{ github.ref_name }} src-tauri/target/release/ditto#ditto-linux-x86_64 --clobber || true
          elif [ "${{ runner.os }}" = "Windows" ]; then
            [ -f "target/release/ditto.exe" ] && gh release upload ${{ github.ref_name }} target/release/ditto.exe#ditto_windows_x86_64.exe --clobber || true
            [ -f "src-tauri/target/release/ditto.exe" ] && gh release upload ${{ github.ref_name }} src-tauri/target/release/ditto.exe#ditto_windows_x86_64.exe --clobber || true
          elif [ "${{ runner.os }}" = "macOS" ]; then
            [ -f "target/release/ditto" ] && gh release upload ${{ github.ref_name }} target/release/ditto#ditto-darwin-x86_64 --clobber || true
            [ -f "src-tauri/target/release/ditto" ] && gh release upload ${{ github.ref_name }} src-tauri/target/release/ditto#ditto-darwin-x86_64 --clobber || true
          fi
