[package]
name = "ditto-core"
version = "1.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clipboard-rs = "0.3.3"
rusqlite = { version = "0.40.1", features = ["bundled"] }
parking_lot = "0.12"
base64 = "0.22.1"
image = { version = "0.25", default-features = false, features = ["png"] }
dirs = "5.0"
