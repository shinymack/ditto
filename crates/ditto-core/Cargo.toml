[package]
name = "ditto-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3.6.1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
base64 = "0.22.1"
image = { version = "0.25", default-features = false, features = ["png"] }
